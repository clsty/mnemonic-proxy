# Author: Maurizio Verde — LastReload
# Publishes mnemonic-proxy to PyPI when a GitHub release is published.
# PyPI Trusted Publishing (OIDC): no token or secret in the repository. On PyPI the trusted publisher is
# lastreload/mnemonic-proxy, workflow publish.yml, environment pypi — keep these names exactly as they are.
name: publish
on:
  release:
    types: [published]
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: tag matches the package version
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          VERSION=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          INIT=$(python -c "import re; print(re.search(r'__version__ = \"(.+)\"', open('ctxproxy/__init__.py').read()).group(1))")
          echo "tag=$TAG pyproject=$VERSION __init__=$INIT"
          test "$TAG" = "v$VERSION" && test "$INIT" = "$VERSION"
      - name: build sdist and wheel
        run: |
          python -m pip install --upgrade build twine
          python -m build
          python -m twine check --strict dist/*
          ls -l dist
      - name: smoke test of the wheel (clean venv)
        run: |
          python -m venv /tmp/smoke
          /tmp/smoke/bin/pip install dist/*.whl
          cd /tmp && /tmp/smoke/bin/mnemonic-proxy demo && /tmp/smoke/bin/mnemonic-mcp --help > /dev/null
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  pypi:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/project/mnemonic-proxy/
    permissions:
      id-token: write   # OIDC token for Trusted Publishing; nothing else
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
